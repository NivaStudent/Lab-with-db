version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Qwerty123!12345678
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 12345678 -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: smart-dashboard-backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: smart-dashboard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend