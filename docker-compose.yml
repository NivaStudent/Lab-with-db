services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Qwerty123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1433"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: smart-dashboard-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_USER=sa
      - DB_PASSWORD=Qwerty123!
      - DB_SERVER=database
      - DB_NAME=Laba11
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: smart-dashboard-frontend
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend